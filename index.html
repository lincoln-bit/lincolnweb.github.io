<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1/18 倒數計時器</title>
    <!-- 引入 Tailwind CSS 以快速設定樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入與 Notion 相似的無襯線字體 Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* 讓背景預設為透明，完美融入 Notion 淺色/深色模式 */
            background-color: transparent; 
            margin: 0;
            overflow: hidden; /* 防止 Notion 區塊出現多餘的捲軸 */
        }
        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 8px;
            padding: 0.4rem;
            width: 60px; /* 縮小寬度，讓橫排更緊湊 */
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="flex items-start justify-start p-1 sm:p-2">

    <!-- 將主容器改為 inline-flex 橫向排列的 Widget 風格 -->
    <div class="inline-flex flex-row flex-wrap sm:flex-nowrap items-center gap-4 sm:gap-6 p-4 bg-white rounded-xl shadow-sm border border-gray-100">
        
        <!-- 左側標題 -->
        <div class="flex flex-col flex-shrink-0">
            <h1 class="text-base sm:text-lg font-semibold text-gray-800 m-0 whitespace-nowrap">距離 1/18 還剩</h1>
            <p id="target-date-text" class="mt-1 text-[11px] text-gray-400 font-medium whitespace-nowrap"></p>
        </div>
        
        <!-- 右側倒數數字 (強制橫排 flex-nowrap) -->
        <div class="flex flex-row flex-nowrap justify-center gap-2">
            <div class="time-block">
                <span id="days" class="text-xl font-bold text-gray-900">00</span>
                <span class="text-[10px] text-gray-500 mt-0.5 font-medium">天</span>
            </div>
            <div class="time-block">
                <span id="hours" class="text-xl font-bold text-gray-900">00</span>
                <span class="text-[10px] text-gray-500 mt-0.5 font-medium">時</span>
            </div>
            <div class="time-block">
                <span id="minutes" class="text-xl font-bold text-gray-900">00</span>
                <span class="text-[10px] text-gray-500 mt-0.5 font-medium">分</span>
            </div>
            <div class="time-block">
                <span id="seconds" class="text-xl font-bold text-gray-900">00</span>
                <span class="text-[10px] text-gray-500 mt-0.5 font-medium">秒</span>
            </div>
        </div>

    </div>

    <script>
        function updateCountdown() {
            const now = new Date();
            let targetYear = now.getFullYear();
            
            // 設定目標日期為今年的 1/18
            let targetDate = new Date(`January 18, ${targetYear} 00:00:00`);
            
            // 如果今年的 1/18 已經過了，則將目標設定為明年的 1/18
            if (now.getTime() > targetDate.getTime()) {
                targetYear += 1;
                targetDate = new Date(`January 18, ${targetYear} 00:00:00`);
            }

            document.getElementById('target-date-text').innerText = `目標日期：${targetYear} 年 1 月 18 日`;

            const difference = targetDate.getTime() - now.getTime();

            // 計算天、時、分、秒
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // 更新到畫面上，並在數字小於 10 時補 0
            document.getElementById('days').innerText = days.toString().padStart(2, '0');
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
        }

        // 初始執行一次
        updateCountdown();
        
        // 設定每秒更新一次 (1000 毫秒)
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
